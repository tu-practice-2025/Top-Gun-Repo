<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="js/login.js"></script>

</head>
<body>
    <header>
        <div class="logo">
            Budget Tracker
        </div>
        <div class="nav-buttons">
            <div>📞 02 933 7 333</div>
            <div>📱 15 333</div>
        </div>
    </header>

    <main class="main-body">
        <div class="login-container">
        <div class="login-header">Тракер на разходи</div>

        <!-- Toggle Button -->
        <button id="toggleForm" class="toggle-button" title="Превключи формата">⇄</button>

        <!-- Forms Wrapper -->
        <div class="form-wrapper">
            <!-- Login Form -->
            <form id="loginForm" class="form active">
                <label for="email">Имейл</label>
                <input type="text" name="email" id="email" required>

                <label for="password">Парола</label>
                <input type="password" name="password" id="password" required>

                <a href="#" class="forgot">Забравена парола?</a>

                <input type="submit" value="ВХОД">
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="form">
                <label for="name">Име</label>
                <input type="text" name="name" id="name" required>

                <label for="emailRegister">Имейл</label>
                <input type="text" name="email" id="emailRegister" required>

                <label for="passwordRegister">Парола</label>
                <input type="password" name="password" id="passwordRegister" required>

                <input type="submit" value="РЕГИСТРАЦИЯ">
            </form>
        </div>
    </div>

    </main>

    <footer>
        <div class="footer-col">
            <h4>Сигурност</h4>
            <p><a href="#">Препоръки за сигурност</a></p>
            <p><a href="#">Политика за бисквитки</a></p>
        </div>
        <div class="footer-col">
            <h4>Новини</h4>
            <p><a href="#">Важно! Годишно приключване 2024 г.</a></p>
            <p><a href="#">Местни данъци и такси</a></p>
        </div>
        <div class="footer-col">
            <h4>Документи</h4>
            <p><a href="#">Общи условия</a></p>
            <p><a href="#">Видео с възможности за работа</a></p>
        </div>
    </footer>
</body>
</html>
