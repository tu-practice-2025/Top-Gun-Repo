<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css" />
    <script src="js/login.js"></script>
  </head>
  <body>
    <div class="particles" id="particles"></div>

    <header class="top-header">
      <div class="top-bar">
        <h1>Budget tracker</h1>
      </div>
    </header>

    <main class="main-body">
      <div class="geometric-bg">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
      </div>

      <div class="login-container">
        <div class="log-register">
          <div class="login-header" id="formTitle">Добре дошли!</div>
          <div class="login-header1" id="formSubtitle"></div>

          <button id="toggleForm" class="toggle-button" title="Switch form">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-arrows-right-left"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M21 7l-18 0" />
              <path d="M18 10l3 -3l-3 -3" />
              <path d="M6 20l-3 -3l3 -3" />
              <path d="M3 17l18 0" />
            </svg>
          </button>
        </div>

        <div class="form-wrapper">
          <form id="loginForm" class="form active">
            <label for="email">Имейл</label>
            <input type="text" name="email" id="email" required />

            <label for="password">Парола</label>
            <input type="password" name="password" id="password" required />

            <a href="#" class="forgot">Забравена парола?</a>

            <input type="submit" value="Вход" />
          </form>

          <form id="registerForm" class="form">
            <label for="name">Име</label>
            <input type="text" name="name" id="name" required />

            <label for="emailRegister">Имейл</label>
            <input type="text" name="email" id="emailRegister" required />

            <label for="passwordRegister">Парола</label>
            <input
              type="password"
              name="password"
              id="passwordRegister"
              required
            />

            <input type="submit" value="Регистрация" />
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
