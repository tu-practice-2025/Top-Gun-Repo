<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/homeScreen.css" />
    <title>Budget Tracker</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/homeScreen.js"></script>
  </head>

  <body>
    <header class="top-header">
      <div class="top-bar">
        <h1>Budget tracker</h1>
        <div class="pulse-circles-top">
          <div class="circle circle1"></div>
          <div class="circle circle2"></div>
          <div class="circle circle3"></div>
          <div class="circle circle4"></div>
        </div>
      </div>
    </header>

    <div class="nav-bar">
      <a class="active" href="homeScreen.html">Home</a>
      <a href="details.html">Details</a>
      <a href="planing.html">Planning</a>
    </div>

    <div class="content">
      <div class="chart-section">
        <div class="left-column">
          <div class="doughnut-legend-box">
            <div class="chart-title">Expenses</div>

            <div class="doughnut-legend-content">
              <div class="doughnut-chart">
                <canvas id="myChart"></canvas>
              </div>

              <div class="legend-box"></div>
            </div>
          </div>
        </div>

        <div class="right-column">
          <div class="summary-boxes">
            <div class="summary-box">
              <h2>Expenses</h2>
              <p id="total-expenses" class="summary-amount">BGN 0.00</p>
            </div>

            <div class="summary-box">
              <h2>Income</h2>
              <p id="total-income" class="summary-amount">BGN 0.00</p>
            </div>
          </div>

          <div class="bar-section">
            <div class="bar-chart-box">
              <div class="chart-title">Income</div>

              <div class="bar-chart">
                <canvas id="barChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
