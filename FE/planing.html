<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/planing.css" />
    <title>Budget Tracker</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/planing.js"></script>
  </head>

  <body>
    <header class="top-header">
        <div class="top-bar">
            <h1>BUDGET TRACKER</h1>
            <div class="pulse-circles-top">
                <div class="circle circle1"></div>
                <div class="circle circle2"></div>
                <div class="circle circle3"></div>
                <div class="circle circle4"></div>
                <div class="circle circle5"></div>
            </div>
        </div> 
    </header>

    <div class="nav-bar">
        <a href="homeScreen.html">Home</a>
        <a href="details.html">Details</a>
        <a class="active" href="planing.html">Planning</a>
           <a href="account.html" class="profile-button">
        <div class="profile-icon">
          👤
        </div>
      </a>
    </div>

    <div class="content">
      <div class="container-wrapper">
        <div class="table-wrapper-with-popup">
          <div class="table-section">
            <div class="table-wrapper">
              <table class="expenses-tab" id="expensesTable">
                <thead>
                  <tr>
                    <th>Type</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th colspan="2">Options</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
              <p id="emptyMessage" class="empty-message">No add data</p>
            </div>
  
            <button id="addRowBtn" class="add-row-btn">+</button>
  
            <div class="footer-progress">
              <div class="progress-inputs">
                <div id="totalDisplay" class="total-display">Total: 0$</div>
                <div class="progress-container">
                  <div class="progress">
                    <div class="progress-bar" data-done="0"></div>
                  </div>
                </div>
                <div id="maxValueDisplay" class="max-value-display">0.00$</div>
                <div id="budgetWarning" class="budget-warning">Over budget!</div>
              </div>
            </div>
          </div>
  
          <div id="popupForm" class="popup-overlay">
            <div class="popup-content">
              <h3>Add Expenses</h3>
  
              <label for="inputCategory">Category:</label>
              <select id="inputCategory">
                <option value="">-- Choose --</option>
              </select>
  
              <label for="inputAmount">Amount (BGN):</label>
              <input type="number" id="inputAmount" placeholder="BGN" />

              <div class="entry-type-group">
                <div class="radio-button-group">
                  <label class="radio-btn">
                    <input type="radio" name="entryType" value="Expense" checked>
                    <span>Expense</span>
                  </label>
                  <label class="radio-btn">
                    <input type="radio" name="entryType" value="Income">
                    <span>Income</span>
                  </label>
                </div>
              </div>

              <div class="popup-buttons">
                <button id="confirmAdd">Add</button>
                <button id="cancelAdd">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
  </body>
</html>
