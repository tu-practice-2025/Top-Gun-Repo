<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/planing.css" />
    <title>Budget Tracker</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/planing.js"></script>
  </head>

  <body>
    <header class="top-header">
        <div class="top-bar">
            <h1>BUDGET TRACKER</h1>
            <div class="pulse-circles-top">
                <div class="circle circle1"></div>
                <div class="circle circle2"></div>
                <div class="circle circle3"></div>
                <div class="circle circle4"></div>
                <div class="circle circle5"></div>
            </div>
        </div> 
    </header>

    <div class="nav-bar">
        <a href="homeScreen.html">Начало</a>
        <a href="details.html">Детайли</a>
        <a class="active" href="planing.html">Планиране</a>
        <div class="profile-container">
          <div class="dropdown profile-dropdown">
            <button onclick="toggleDropdown()" class="dropbtn">
              <div class="profile-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="35"
                  height="35"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="icon icon-tabler icons-tabler-outline icon-tabler-user-circle"
                >
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
                  <path d="M12 10m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
                  <path
                    d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855"
                  />
                </svg>
              </div>
            </button>
          </div>
        </div>
      </div>
  
      <div id="profileDropdown" class="dropdown-content">
        <div class="profile-picture">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="35"
            height="35"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-user-circle"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
            <path d="M12 10m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
            <path
              d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855"
            />
          </svg>
        </div>
  
        <div class="profile-info">
          <span id="dropdownUserName"></span><br />
          <span id="dropdownUserEmail"></span>
        </div>
        <div class="dropdown-buttons">
          <button id="dropdownLogoutBtn" class="action-btn logout-btn">
            Изход
          </button>
        </div>
      </div>

    <div class="content">
      <div class="container-wrapper">
        <div class="table-wrapper-with-popup">
          <div class="table-section">
            <div class="table-wrapper">
              <table class="expenses-tab" id="expensesTable">
                <thead>
                  <tr>
                    <th>Вид</th>
                    <th>Категория</th>
                    <th>Сума</th>
                    <th colspan="2">Опции</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
              <p id="emptyMessage" class="empty-message">Няма добавени разходи</p>
            </div>
  
            <button id="addRowBtn" class="add-row-btn">+</button>
  
            <div class="footer-progress">
              <div class="progress-inputs">
                <div id="totalDisplay" class="total-display">Общо: 0$</div>
                <div class="progress-container">
                  <div class="progress">
                    <div class="progress-bar" data-done="0"></div>
                  </div>
                </div>
                <div id="maxValueDisplay" class="max-value-display">0.00$</div>
                <div id="budgetWarning" class="budget-warning">Превишен бюджет!</div>
              </div>
            </div>
          </div>
  
          <div id="popupForm" class="popup-overlay">
            <div class="popup-content">
              <h3>Добави разходи/приходи</h3>
  
              <label for="inputCategory">Категории:</label>
              <select id="inputCategory">
                <option value="">-- Избери --</option>
              </select>
  
              <label for="inputAmount">Сума (BGN):</label>
              <input type="number" id="inputAmount" placeholder="BGN" />

              <div class="entry-type-group">
                <div class="radio-button-group">
                  <label class="radio-btn">
                    <input type="radio" name="entryType" value="Expense" checked>
                    <span>Разход</span>
                  </label>
                  <label class="radio-btn">
                    <input type="radio" name="entryType" value="Income">
                    <span>Приход</span>
                  </label>
                </div>
              </div>

              <div class="popup-buttons">
                <button id="confirmAdd">Добави</button>
                <button id="cancelAdd">Откажи</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>

    <button class="ai-button" id="chat-toggle">
          <svg xmlns="http://www.w3.org/2000/svg" class="ai-icon" version="1.0" width="158pt" height="148pt" viewBox="0 0 158 148" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff0000" />      
                <stop offset="40%" stop-color="#ff5e5e" />      
                <stop offset="100%" stop-color="#4facfe" />     
              </linearGradient>

            </defs>
            <g transform="translate(0,148) scale(0.1,-0.1)" fill="url(#redGradient)" stroke="none">
              <path d="M646 1288 c-3 -7 -7 -29 -10 -48 -13 -76 -70 -132 -148 -145 -51 -9 -44 -28 13 -37 24 -4 55 -16 69 -26 33 -24 70 -98 70 -140 0 -47 23 -37 31 14 15 91 61 139 147 153 49 9 44 22 -16 41 -29 10 -62 26 -74 36 -27 24 -57 91 -58 126 0 29 -17 48 -24 26z"/>
              <path d="M1070 1011 c0 -62 -36 -163 -74 -207 -43 -50 -117 -91 -195 -107 -34 -6 -62 -16 -62 -22 0 -5 24 -13 53 -17 97 -12 173 -57 225 -133 26 -38 53 -127 53 -177 0 -25 5 -38 14 -38 9 0 15 19 20 61 8 77 37 143 84 192 55 57 91 74 225 102 39 8 26 21 -30 30 -61 8 -150 48 -186 83 -58 55 -97 150 -97 235 0 26 -4 37 -15 37 -11 0 -15 -11 -15 -39z"/>
              <path d="M476 638 c-3 -7 -7 -30 -10 -52 -9 -70 -50 -110 -132 -131 -54 -14 -57 -27 -9 -37 84 -18 132 -66 143 -145 9 -58 27 -66 36 -16 16 95 60 142 149 158 41 8 52 35 14 35 -13 0 -46 11 -74 25 -53 27 -75 61 -88 138 -6 36 -22 50 -29 25z"/>
            </g>
          </svg>
        </button>

        <div id="chat-window" class="chat-window show-chat">
          <div class="chat-header">
            AI Tips
            <span style="float:right; cursor:pointer;" id="closeBtn">×</span>
          </div>
          <div class="chat-body">
            <button id="getTipsBtn" class="get-tips-button">Get Tips</button>
            <div id="tipsOutput" class="tips-output"></div>
          </div>
        </div>
      </div>
      <script type="module" src="./js/details.js"></script>

  </body>
</html>
